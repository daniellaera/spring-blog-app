<div class="flex flex-column gap-3">
  <div class="flex flex-column gap-2">
    <label for="titleInput" class="font-medium">Title</label>
    <input
      pInputText
      id="titleInput"
      [(ngModel)]="title"
      name="title"
      placeholder="Enter post title"
      class="w-full" />
  </div>

  <div class="flex flex-column gap-2">
    <label for="contentInput" class="font-medium">Content</label>
    <textarea
      pTextarea
      id="contentInput"
      [(ngModel)]="content"
      name="content"
      rows="6"
      placeholder="Write your post content here…"
      class="w-full">
    </textarea>
  </div>

  <div class="flex justify-content-between gap-2 pt-2">
    @if (!post) {
      <p-button
        label="Publish post"
        icon="pi pi-check"
        (onClick)="onAddPost()"
        [loading]="saving" />
    }
    @if (post) {
      <p-button
        label="Save changes"
        icon="pi pi-save"
        (onClick)="onUpdatePost()"
        [loading]="saving" />
      <p-button
        label="Delete"
        icon="pi pi-trash"
        severity="danger"
        [outlined]="true"
        (onClick)="onDeletePost()" />
    }
  </div>
</div>
