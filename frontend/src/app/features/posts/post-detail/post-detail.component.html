<div class="surface-ground min-h-screen py-5 px-3">
  <div style="max-width:780px; margin:0 auto">

    @if (loading) {
      <div class="surface-card border-round-xl shadow-2 p-5">
        <p-skeleton height="3rem" styleClass="mb-4" />
        <div class="flex gap-3 mb-5">
          <p-skeleton shape="circle" size="3rem" />
          <div class="flex flex-column gap-2 flex-1">
            <p-skeleton height="1rem" width="30%" />
            <p-skeleton height="1rem" width="20%" />
          </div>
        </div>
        <p-skeleton height="1rem" styleClass="mb-2" />
        <p-skeleton height="1rem" styleClass="mb-2" />
        <p-skeleton height="1rem" width="70%" />
      </div>
    }

    @if (!loading && post) {
      <p-button
        label="All posts"
        icon="pi pi-arrow-left"
        [text]="true"
        size="small"
        routerLink="/"
        styleClass="mb-4 pl-0" />

      <div class="surface-card border-round-xl shadow-2 p-5 md:p-6">

        <h1 class="text-4xl font-bold line-height-2 mt-0 mb-4">
          {{ post.title }}
        </h1>

        <div class="flex align-items-center justify-content-between flex-wrap gap-3 mb-5 pb-4"
             style="border-bottom:1px solid var(--surface-border)">
          <div class="flex align-items-center gap-3">
            <p-avatar
              [label]="post.author?.charAt(0)?.toUpperCase() || 'U'"
              shape="circle"
              size="large"
              styleClass="bg-primary text-white font-bold" />
            <div>
              <div class="font-semibold">{{ post.author ?? 'Unknown author' }}</div>
            </div>
          </div>

          @if (isAuthor()) {
            <div class="flex gap-2">
              <p-button
                label="Edit"
                icon="pi pi-pencil"
                [outlined]="true"
                size="small"
                [routerLink]="['/posts', post.id, 'edit']" />
              <p-button
                label="Delete"
                icon="pi pi-trash"
                severity="danger"
                [outlined]="true"
                size="small"
                (onClick)="confirmDelete()" />
            </div>
          }
        </div>

        <div class="text-lg line-height-4"
             style="word-break:break-word; white-space:pre-wrap">
          {{ post.content }}
        </div>

        <p-divider />
        <div class="mt-4">
          <h3 class="text-xl font-semibold mb-3">
            <i class="pi pi-comments mr-2"></i>Comments
          </h3>
          <app-comment-form [postId]="post.id!" />
        </div>

      </div>
    }

    @if (!loading && !post) {
      <div class="text-center py-8">
        <i class="pi pi-exclamation-circle text-5xl text-color-secondary mb-3 block"></i>
        <h2 class="text-2xl font-bold">Post not found</h2>
        <p class="text-color-secondary mb-4">
          This post may have been deleted or does not exist.
        </p>
        <p-button label="Back to posts" icon="pi pi-arrow-left" routerLink="/" />
      </div>
    }

  </div>
</div>

<p-confirmDialog />
<p-toast />
