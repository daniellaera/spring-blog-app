<form (ngSubmit)="onSubmit(commentForm)" #commentForm="ngForm" class="flex flex-column gap-3">
  <div class="flex flex-column gap-2">
    <label for="commentText" class="font-medium">Your comment</label>
    <textarea
      pTextarea
      id="commentText"
      [(ngModel)]="commentText"
      name="text"
      rows="4"
      placeholder="Write your comment here…"
      class="w-full"
      required>
    </textarea>
    @if (commentForm.controls['text']?.invalid && commentForm.controls['text']?.dirty) {
      <p-message severity="error" text="Comment is required." />
    }
  </div>

  <div>
    <p-button
      type="submit"
      label="Post comment"
      icon="pi pi-send"
      [loading]="submitting"
      [disabled]="!commentForm.valid" />
  </div>
</form>
